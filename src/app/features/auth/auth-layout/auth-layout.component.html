<div class="auth-layout">
  <div class="auth-layout__inner">
    <!-- Deliberately not a heading: the page's single h1 belongs to what this is about —
         "Anmeldung", "Registrierung". The wordmark is a signpost, not the topic. -->
    <p class="auth-layout__brand">
      <a class="auth-layout__brand-link" [routerLink]="routes.login">Famora</a>
    </p>

    <h1 class="auth-layout__heading">{{ heading() }}</h1>

    @if (intro(); as introText) {
      <div class="auth-layout__notice">
        @if (error(); as message) {
          <famora-form-error [message]="message" />
        } @else {
          <p class="auth-layout__intro">{{ introText }}</p>
        }
      </div>
    }

    <div class="auth-layout__card">
      <ng-content />
    </div>

    <p class="auth-layout__switch">
      <ng-content select="[switch]" />
    </p>

    <!-- margin-top:auto pushes the mandatory links to the bottom even when the card is short. -->
    <div class="auth-layout__legal">
      <famora-legal-footer />
    </div>
  </div>
</div>
