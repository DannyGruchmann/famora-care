<div class="password-strength">
  <div class="password-strength__bar" aria-hidden="true">
    @for (index of segments; track index) {
      <span class="password-strength__segment" [class]="segmentClass(index)"></span>
    }
  </div>

  <!-- role="status": the rating changes while typing and should be announced — but calmly, not
       as an interruption the way aria-live="assertive" would. The reserved height keeps the first
       character from shifting anything. -->
  <p class="password-strength__caption" [class]="textToneClass()" role="status">{{ caption() }}</p>
</div>
