<famora-auth-layout
  heading="Registrierung"
  intro="Ein Konto, damit Ihre Liste auch morgen noch da ist."
  [error]="serverError()"
>
  <form class="register-page__form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <famora-text-field
      formControlName="firstName"
      [fieldId]="fieldIds.firstName"
      label="Ihr Vorname"
      [error]="firstNameError()"
      type="text"
      autocomplete="given-name"
    />

    <famora-text-field
      formControlName="email"
      [fieldId]="fieldIds.email"
      label="E-Mail-Adresse"
      [error]="emailError()"
      type="email"
      autocomplete="email"
    />

    <div>
      <famora-password-field
        formControlName="password"
        [fieldId]="fieldIds.password"
        label="Passwort"
        [hint]="passwordHint"
        [error]="passwordError()"
        autocomplete="new-password"
      />
      <famora-password-strength [value]="password()" />
    </div>

    <!-- Consent as a separate checkbox that has to be ticked actively: pre-selected it would not
         be valid consent under Art. 7 GDPR. -->
    <div class="register-page__consent">
      <label class="register-page__consent-label" [attr.for]="fieldIds.privacy">
        <!-- appearance:none — only a box drawn by hand can actually turn red on error; browsers
             ignore the border of a native checkbox. The tick sits on top as an icon. -->
        <span class="register-page__checkbox">
          <input
            class="register-page__checkbox-input"
            [class.register-page__checkbox-input--invalid]="privacyError() !== undefined"
            formControlName="privacy"
            [id]="fieldIds.privacy"
            type="checkbox"
            [attr.aria-describedby]="privacyErrorId"
            [attr.aria-invalid]="privacyError() !== undefined ? 'true' : null"
          />
          <svg
            lucideCheck
            class="register-page__checkbox-tick"
            stroke-width="3"
            aria-hidden="true"
          ></svg>
        </span>

        <span>
          Ich habe die
          <a class="register-page__consent-link" [routerLink]="routes.privacy">
            Datenschutzerklärung
          </a>
          gelesen.
        </span>
      </label>

      <!-- Without an indent, so the message stays on one line even on narrow devices — a second
           line would push the button out from under the finger. -->
      <p class="register-page__consent-error" [id]="privacyErrorId">{{ privacyError() }}</p>
    </div>

    <!-- Only disabled while submitting — as long as something is missing it stays clickable: a
         greyed-out button only says "no", not "why". -->
    <famora-button type="submit" [fullWidth]="true" [disabled]="isSubmitting()">
      {{ isSubmitting() ? 'Konto wird angelegt …' : 'Konto anlegen' }}
    </famora-button>
  </form>

  <ng-container switch>
    Schon ein Konto?
    <famora-auth-switch-link [target]="routes.login">Anmelden</famora-auth-switch-link>
  </ng-container>
</famora-auth-layout>
