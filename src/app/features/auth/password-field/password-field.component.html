<famora-form-field [fieldId]="fieldId()" [label]="label()" [hint]="hint()" [error]="error()">
  <input
    class="password-field__input"
    [class.password-field__input--invalid]="error() !== undefined"
    [id]="fieldId()"
    [type]="isVisible() ? 'text' : 'password'"
    [value]="value()"
    [disabled]="isDisabled()"
    [attr.autocomplete]="autocomplete()"
    [attr.aria-describedby]="describedBy()"
    [attr.aria-invalid]="error() !== undefined ? 'true' : null"
    required
    (input)="onInput($event)"
    (blur)="onBlur()"
  />

  <button
    type="button"
    class="password-field__toggle"
    [attr.aria-label]="toggleLabel()"
    [attr.aria-pressed]="isVisible()"
    (click)="toggleVisibility()"
  >
    @if (isVisible()) {
      <svg lucideEyeOff class="password-field__toggle-icon" aria-hidden="true"></svg>
    } @else {
      <svg lucideEye class="password-field__toggle-icon" aria-hidden="true"></svg>
    }
  </button>
</famora-form-field>
