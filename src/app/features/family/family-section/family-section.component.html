<p class="family-section__hint">{{ hint() }}</p>

<famora-family-tree class="family-section__tree" [tree]="tree()" [emptyText]="emptyTree" />

@if (helpers().length > 0) {
  <ul class="family-section__list">
    @for (helper of helpers(); track helper.id) {
      <li>
        @if (editingId() === helper.id) {
          <div class="family-section__editor">
            <famora-helper-form
              mode="edit"
              [formId]="'edit-' + helper.id"
              [value]="editingDraft()"
              (submitted)="onChange(helper.id, $event)"
              (cancelled)="closeEditForm()"
              (deleted)="onRemove(helper.id)"
            />
          </div>
        } @else {
          <famora-helper-row [person]="helper" (edit)="openEditForm(helper.id)" />
        }
      </li>
    }
  </ul>
}

<!-- Hidden while a row is being edited: two open forms in one section invite changing the wrong
     person. Everywhere else it stays open, because entering a family is entering several people. -->
@if (editingId() === null) {
  <div class="family-section__add">
    <famora-helper-form formId="add-helper" [value]="addDraft()" (submitted)="onAdd($event)" />
  </div>
}
