<div>
  <label class="select-answer__label" [attr.for]="fieldId()">{{ label() }}</label>

  <div class="select-answer__control">
    <select
      class="select-answer__select"
      [id]="fieldId()"
      [value]="value()"
      (change)="onChange($event)"
    >
      <option value="">{{ placeholder }}</option>
      @for (option of options(); track option.id) {
        <option [value]="option.id">{{ option.label }}</option>
      }
    </select>

    <svg lucideChevronDown class="select-answer__chevron" aria-hidden="true"></svg>
  </div>
</div>
