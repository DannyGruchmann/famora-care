server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Security headers: nginx does not inherit add_header from the server block into a location
    # that sets its own add_header, so the full set is repeated in both blocks below rather than
    # declared once here. CSP only makes sense on the document response (location /), not on
    # asset responses, so it is not repeated in the static-assets block.
    #
    # style-src needs 'unsafe-inline' because Angular's emulated view encapsulation injects
    # component styles as <style> elements at runtime — there is no build step here that could
    # hand out a CSP nonce instead.

    # Hashed build artifacts never change under the same name
    location ~* \.(js|css|woff2|png|jpg|jpeg|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        try_files $uri =404;
    }

    # Angular routes are client-side, so unknown paths must serve the shell
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        # script-src/frame-src/connect-src carry challenges.cloudflare.com for the Turnstile
        # widget on the register and forgot-password forms — absent whenever TURNSTILE_SITE_KEY
        # is unset, but the CSP has to allow for it regardless of which build this is.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://*.supabase.co https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }
}
